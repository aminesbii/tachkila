name: iOS unsigned IPA

# Builds an unsigned .ipa in the cloud (no Mac at home) so the app can be
# sideloaded onto an iPhone with a free Apple ID via Sideloadly or AltStore.
# Manual run: Actions -> "iOS unsigned IPA" -> Run workflow.

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show toolchain
        run: |
          xcodebuild -version
          pod --version

      - name: Build unsigned IPA
        run: bash scripts/build-ios-ipa.sh
        env:
          CI: "1"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tachkila-ios-ipa
          path: dist/Tachkila.ipa
          if-no-files-found: error
          retention-days: 14
